[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeserver"
version = "0.3.0"
description = "A lightweight remote IDE with a Flask server backend, MySQL synchronization, and a custom Tkinter client over Tailscale."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "Faris Muhammad" },
    { name = "Pavithra Muthukumar" },
    { name = "Mrinalika Rajan" }
]
dependencies = [
    "python-dotenv>=1.0.0",
    "mysql-connector-python>=8.0.0",
    "Requests>=2.31.0",
    "Flask>=3.0.0",
    "Flask-SocketIO",
    "python-socketio",
    "simple-websocket",
    "websocket-client>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/farismuhammad17/CodeServer.py"
Repository = "https://github.com/farismuhammad17/CodeServer.py.git"
Documentation = "https://github.com/farismuhammad17/CodeServer.py/blob/main/DOCS.md"
Issues = "https://github.com/farismuhammad17/CodeServer.py/issues"
